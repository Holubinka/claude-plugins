name: pages

# Five jobs, and the split is the point: each one shows up as its own check, so a red
# mark says *what* broke without opening the log.
#
#   Release tags     cut {plugin}--v{version} for any manifest version not yet tagged
#   Catalogue index  the data generates, and its metadata gate passes  → plugins/, docs/
#   Search ranking   the natural-language probes still find the right page
#   Site build       Astro builds, and the client bundle is within budget
#   Deploy           publish to Pages
#
# Tagging lives here rather than in a workflow of its own, and that is not tidiness.
# Two things rule the alternatives out:
#
#   - A tag pushed with GITHUB_TOKEN does not trigger another workflow — GitHub's guard
#     against recursive runs — so a standalone tag workflow would cut the tags and leave
#     the site reporting the state before them.
#   - Triggering this workflow on a tag push cannot work either: the run checks out the
#     tag ref, and the github-pages environment admits `main` alone, so the deploy is
#     rejected by the environment rather than skipped.
#
# Making it the first job in this chain sidesteps both: the index reads the tags in the
# same main-branch run that created them.
#
# Before this split, all three ran in one job called "build", so a failing metadata
# warning and a broken Astro template were the same red X. The marketplace harness
# itself — manifests, structure, secrets — is a separate workflow (validate.yml) and is
# deliberately not mixed in here.

on:
  push:
    # Branches only. A `tags:` filter was here, added because release tags are data —
    # releases() reads refs/tags, and the dependency-health badges resolve each declared
    # range against them — so a tag push changed what the catalogue should say and
    # nothing rebuilt it.
    #
    # It is gone because it cannot work and is no longer needed. Cannot: the run checks
    # out the tag ref, and the github-pages environment admits deployments from `main`
    # alone, so every tag-triggered run died with "not allowed to deploy to github-pages
    # due to environment protection rules". No longer needed: the `tags` job below cuts
    # the tags inside the main-branch run, before the index reads them.
    branches: [main]
    # Deliberately no `paths` filter. The index is not a pure function of the files it
    # reads: commit dates feed every artifact's "updated" field and the catalogue's "last
    # change", and tags feed releases and health. A path filter would skip builds that
    # change what the site says.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a superseded run has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tags:
    name: Release tags
    # Only a real push to main may cut one. A pull request must never create a tag:
    # a tag is a published fact, and a proposal is not.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Existing tags are the input — without them every run would try to cut all of them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Cut any tag a manifest version is missing
        run: bash scripts/tag-releases.sh

  index:
    name: Catalogue index
    needs: [tags]
    # `tags` is skipped on a pull request, and a skipped dependency skips its dependents
    # unless the condition says otherwise.
    if: always() && (needs.tags.result == 'success' || needs.tags.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # Tags and commit dates are part of the data, so the full history is required.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generates site/src/data/ and site/public/data/, and fails on a metadata error.
      # Neither directory is committed — see .gitignore for why.
      - name: Build the catalogue data
        run: python3 scripts/build-index.py

      # The two jobs below both need this data and neither should regenerate it: one
      # index, measured once, is what makes their verdicts comparable.
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-data
          path: |
            site/src/data
            site/public/data
          retention-days: 1

  probes:
    name: Search ranking
    needs: index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: catalogue-data
          path: site

      - name: Install
        working-directory: site
        run: npm ci

      # Natural-language probes against the real index, using the same ranking module
      # the browser loads. A description change that breaks findability fails here, and
      # only here — it is not a build failure and should not read as one.
      - name: Probe the search ranking
        working-directory: site
        run: node tests/search.test.mjs

  site:
    name: Site build
    needs: index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: catalogue-data
          path: site

      - name: Install
        working-directory: site
        run: npm ci

      - name: Type-check the components
        working-directory: site
        run: npx astro check

      - name: Build the site
        working-directory: site
        # Set SITE_ORIGIN to the domain and SITE_BASE to '/' once the CNAME lands.
        env:
          SITE_ORIGIN: https://holubinka.github.io
          SITE_BASE: /claude-plugins/
        # The build's own prebuild hook would regenerate the index; the artifact from
        # `index` is already in place, so run Astro directly.
        run: npx astro build

      - name: Check the client bundle against its budget
        working-directory: site
        run: |
          set -euo pipefail
          bytes=$(find dist/_astro -name '*.js' -exec gzip -c {} \; | wc -c)
          limit=$((60 * 1024))
          echo "client JS: ${bytes} bytes gzipped (budget ${limit})"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::client JS is over the 60 KB gzipped budget"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

      # Pages has no preview deployments, so a reviewer downloads the build instead.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: site-preview
          path: site/dist
          retention-days: 7

  deploy:
    name: Deploy
    # Both gates must be green: a site that builds but no longer finds its own docs is
    # not something to publish.
    needs: [probes, site]
    # The ref check is not redundant with the trigger. The github-pages environment
    # admits `main` and nothing else, and a run that reaches the environment from any
    # other ref is *rejected* — a red Deploy on a run where nothing was wrong. Skipping
    # is the honest outcome, so make it structural rather than leaving it to be refused.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
